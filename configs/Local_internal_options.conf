# Append to: /var/ossec/etc/local_internal_options.conf
# Fixes: wazuh-analysisd: ERROR: Too many fields for JSON decoder.
# Cause: CloudTrail events (especially IAM/S3 policy-heavy ones) can exceed
# the default 256-field cap on Wazuh's classic JSON decoder.
# 1024 is the documented maximum. Even at max, unusually large events can
# still occasionally trip this — a known limitation, not a config error.

analysisd.decoder_order_size=1024
