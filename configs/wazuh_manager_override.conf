# systemd override — fixes "config profile could not be found" errors from
# the AWS S3 wodle when wazuh-manager is launched by systemd rather than an
# interactive login shell.
#
# Install at:
#   /etc/systemd/system/wazuh-manager.service.d/override.conf
#
# Apply with:
#   sudo systemctl daemon-reload
#   sudo systemctl restart wazuh-manager
#
# Diagnose first with:
#   grep wazuh /etc/passwd        (confirm the wazuh user's actual home dir)
#   sudo -u wazuh sh -c 'echo $HOME'   (in an interactive shell — often looks
#                                        fine here even when systemd's
#                                        environment differs)

[Service]
Environment="HOME=/var/ossec"
